            const btnBcv = document.getElementById('btn-bcv');
            const btnDivisas = document.getElementById('btn-divisas');

            const activeClass = "px-6 py-2 rounded-full text-sm font-black bg-black dark:bg-gray-800 text-white shadow border-b-2 border-green-500 transition-all scale-105";
            const inactiveClass = "px-6 py-2 rounded-full text-sm font-bold text-gray-500 dark:text-gray-400 hover:text-green-500 transition-all bg-transparent border-b-2 border-transparent scale-100";

            if (currency === 'BCV') {
                btnBcv.className = activeClass;
                btnDivisas.className = inactiveClass;
            } else {
                btnDivisas.className = activeClass;
                btnBcv.className = inactiveClass;
            }
            renderProducts(); 
        }

        // Función para manejar el buscador
        function handleSearch() {
            searchTerm = document.getElementById('search-input').value.toLowerCase();
            renderProducts();
        }

        // Función para cambiar de categoría
        function filterCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.className = "cat-tab px-5 py-2 rounded-full text-sm font-bold bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-green-100 hover:text-green-600 transition-all border border-transparent";
            });
            const activeTab = document.getElementById(`tab-${category}`);
            if(activeTab) {
                activeTab.className = "cat-tab px-5 py-2 rounded-full text-sm font-black bg-green-500 text-white shadow-sm shadow-green-500/40 border border-green-400 transition-all scale-105";
            }

            renderProducts();
        }

        // Dibuja la cuadrícula de productos
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            const filtered = productos.filter(p => {
                const matchesCategory = currentCategory === 'todos' || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchTerm);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 font-bold text-sm">
                    <i class="fas fa-search-minus mb-3 text-3xl text-green-500/50"></i><br>
                    No encontramos prendas con ese nombre.
                </div>`;
                return;
            }

            filtered.forEach(p => {
                let priceText = '';
                if (p.type === 'corta') {
                    priceText = currentCurrency === 'BCV' ? '30$BCV' : '25$ Divisas';
                } else if (p.type === 'larga') {
                    priceText = currentCurrency === 'BCV' ? '35$BCV' : '30$ Divisas';
                } else if (p.type === 'shorts') {                
                    priceText = currentCurrency === 'BCV' ? '9$BCV' : '8$ Divisas';
                } else if (p.type === 'guantes') {                
                    priceText = currentCurrency === 'BCV' ? '25$BCV' : '22$ Divisas';
                } else if (p.type === 'oferta') {                
                    priceText = currentCurrency === 'BCV' ? '26$BCV' : '23$ Divisas';
                }

                // Aquí se aplica el border-white para recuadros en modo claro y dark:border-gray-700 en modo oscuro
                const card = `
                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm hover:shadow-md border-2 border-white dark:border-gray-700 overflow-hidden flex flex-col cursor-pointer hover:border-green-400 dark:hover:border-green-500 transition-all duration-300 transform hover:-translate-y-1 group" onclick="openModal('${p.name}')">
                        <div class="aspect-square bg-gray-50 dark:bg-gray-900 relative overflow-hidden flex items-center justify-center">
                            <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" 
                                 onerror="this.onerror=null; this.src='https://placehold.co/400x400/eeeeee/999999?text=SD+Jerseys';">
                        </div>
                        <div class="p-3 flex flex-col flex-grow">
                            <h3 class="font-bold text-gray-800 dark:text-gray-100 text-xs mb-2 leading-tight line-clamp-2">${p.name}</h3>
                            <div class="mt-auto flex justify-between items-end">
                                <span class="font-black text-sm text-green-600 dark:text-green-400 drop-shadow-sm">${priceText}</span>
                                <button class="bg-black text-white text-[10px] font-bold w-7 h-7 rounded-full flex items-center justify-center group-hover:bg-green-500 transition-all duration-300">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // FUNCIONES DEL MODAL
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');

        function openModal(productName) {
            selectedProductForModal = productName;
            document.getElementById('modal-product-name').innerText = productName;
            
            modal.classList.remove('modal-inactive');
            modal.classList.add('modal-active');
            modalContent.classList.remove('scale-down');
            modalContent.classList.add('scale-up');
        }

        function closeModal() {
            modal.classList.remove('modal-active');
            modal.classList.add('modal-inactive');
            modalContent.classList.remove('scale-up');
            modalContent.classList.add('scale-down');
        }

        // Redirecciones
        function goToWhatsApp() {
            const mensaje = encodeURIComponent(`Hola, vengo de la tienda web. Quiero consultar disponibilidad, tallas y pago para: ${selectedProductForModal}`);
            window.open(`https://wa.me/584163403334?text=${mensaje}`, '_blank');
        }

        function goToInstagram() {
            window.open('https://www.instagram.com/sdjer6/', '_blank');
        }

        function goToTikTok() {
            window.open('https://www.tiktok.com/@sdjer6_', '_blank');
        }

        // Inicializar
        renderProducts();
    </script>
</body>
</html>
